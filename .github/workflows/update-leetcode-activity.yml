name: Update coding activity snapshots

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public submission calendar
        run: python scripts/update_leetcode_activity.py
      - name: Fetch public GitHub contribution calendar
        run: python scripts/update_github_activity.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity/leetcode.json
          git add activity/github.json
          if git diff --cached --quiet; then
            echo "LeetCode activity snapshot is unchanged."
          else
            git commit -m "chore: update LeetCode activity snapshot"
            git push
          fi
