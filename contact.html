<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Contact Tarun G about software engineering, projects, and collaboration.">
  <title>Contact — Tarun G</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b0b0b;--text:#eee;--muted:#999;--line:#252525;--green:#58d68d;--sans:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}.topbar{height:70px;position:sticky;top:0;z-index:2;background:rgba(8,8,8,.96);border-bottom:1px solid var(--line);display:flex;justify-content:center}.topbar-inner{width:min(950px,100%);height:100%;padding:0 30px;display:flex;align-items:center;border-left:1px solid #1a1a1a;border-right:1px solid #1a1a1a}.brand{font-size:19px;font-weight:700;letter-spacing:-.045em;text-decoration:none}.primary-nav{display:flex;gap:24px;align-items:center;margin-left:auto}.primary-nav a{font:14px var(--mono);color:#aaa;text-decoration:none}.primary-nav a:hover,.primary-nav a[aria-current=page]{color:#f3f3f3}.page{width:min(950px,calc(100% - 32px));min-height:calc(100vh - 70px);margin:0 auto;padding:0 30px;border-left:1px solid #1a1a1a;border-right:1px solid #1a1a1a}.hero{height:200px;margin:0 -30px;border-bottom:1px solid #222;background-image:radial-gradient(#262626 1.2px,transparent 1.3px);background-size:14px 14px;mask-image:linear-gradient(to bottom,#000 35%,transparent 100%)}.content{max-width:680px;margin:0 auto;padding:22px 0 56px}.eyebrow{font:11px var(--mono);color:var(--green);letter-spacing:.08em}.content h1{margin:8px 0 12px;font-size:clamp(36px,6vw,54px);line-height:1.1;letter-spacing:-.05em}.intro{margin:0 0 28px;color:#aaa}.form{display:grid;gap:17px}.field{display:grid;gap:7px}.field label{font:12px var(--mono);color:#aaa}.field input,.field textarea{width:100%;border:1px solid #303030;border-radius:5px;padding:12px 13px;background:#101010;color:var(--text);font:14px var(--sans)}.field textarea{min-height:160px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:#666}.submit{justify-self:start;border:1px solid #376c4d;border-radius:5px;background:transparent;color:var(--green);padding:10px 15px;font:12px var(--mono);cursor:pointer}.submit:hover{background:#102218}.note{color:#777;font-size:12px;margin:0}.footer{max-width:680px;margin:0 auto;border-top:1px solid var(--line);padding:18px 0 30px;display:flex;justify-content:space-between;color:#707070;font:10px var(--mono)}
    @media(max-width:620px){.topbar{height:62px}.topbar-inner{padding:0 16px}.brand{font-size:16px}.primary-nav{gap:12px}.primary-nav a{font-size:12px}.page{width:calc(100% - 24px);padding:0 18px}.hero{margin:0 -18px;height:160px}.content{padding-top:20px}.footer{gap:10px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="https://tarunnaidu.tech/" aria-label="Tarun G home">tarunnaidu</a>
    <nav class="primary-nav" aria-label="Main navigation"><a href="https://tarunnaidu.tech/">Home</a><a href="projects.html">Projects</a><a href="contact.html" aria-current="page">Contact</a></nav>
  </div></header>
  <main class="page">
    <div class="hero" aria-hidden="true"></div>
    <section class="content" aria-labelledby="contact-title">
      <div class="eyebrow">GET IN TOUCH</div>
      <h1 id="contact-title">Let's talk.</h1>
      <p class="intro">Have a project, opportunity, or question? Send me a message.</p>
      <form class="form" id="contact-form">
        <input type="hidden" name="access_key" value="39a4e0db-fd3b-45d4-8296-195799ab7878">
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" placeholder="Name" required></div>
        <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" placeholder="What would you like to discuss?" required></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="Write your message…" required></textarea></div>
        <button class="submit" type="submit">Send message ↗</button>
        <p class="note" id="form-status" role="status" aria-live="polite">Messages are sent securely through Web3Forms. You can also email <a href="mailto:tarunnaidug5@gmail.com">tarunnaidug5@gmail.com</a>.</p>
      </form>
    </section>
    <footer class="footer"><span>© <span id="year"></span> Tarun G · Bengaluru, India</span><a href="https://tarunnaidu.tech/">Home</a></footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('contact-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const status = document.getElementById('form-status');
      const originalLabel = button.textContent;
      button.disabled = true; button.textContent = 'Sending…'; status.textContent = 'Sending your message…';
      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error('Submission was not accepted');
        status.textContent = 'Message sent. Thanks for reaching out!'; form.reset();
      } catch {
        status.textContent = 'Could not send right now. Please email tarunnaidug5@gmail.com instead.';
      } finally { button.disabled = false; button.textContent = originalLabel; }
    });
  </script>
</body>
</html>
